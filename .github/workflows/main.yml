name: "Smile Dental CI/CD"

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20" # or whatever version you're using

      - name: Install and Build
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          CI: false

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.newssawal.com
          username: ditsa_github@ditsa.com.np
          password: V6qwDJqfrB]X
          local-dir: ./out/
